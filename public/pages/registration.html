    <header class="site-header">

    <main>
        <form id="registrationForm" class="registration-form" method="POST" action="../process-registration.php" onsubmit="return registerForm(event)">
            <h2>New Student Registration</h2>

            <div id="registrationAlert" class="alert-box" style="display: none;" role="alert"></div>

            <input type="hidden" name="csrf_token" id="csrf_token" value="">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="mobile">Mobile:</label>
            <input type="text" id="mobile" name="mobile" placeholder="Enter your Mobile no" maxlength="10" required>

            <label for="course">Course:</label>
            <input type="text" id="course" name="course" placeholder="Enter the course" required>

            <label>Gender:</label>
            <div class="options-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
            </select>

            <label>Hobbies:</label>
            <div class="options-group">
                <label><input type="checkbox" name="hobby[]" value="Travelling"> Travelling</label>
                <label><input type="checkbox" name="hobby[]" value="Dancing"> Dancing</label>
                <label><input type="checkbox" name="hobby[]" value="Singing"> Singing</label>
                <label><input type="checkbox" name="hobby[]" value="Sports"> Sports</label>
                <label><input type="checkbox" name="hobby[]" value="Reading"> Reading</label>
                <label><input type="checkbox" name="hobby[]" value="Other"> Other</label>
            </div>

            <label for="username">Username (Optional):</label>
            <input type="text" id="username" name="username" placeholder="Choose a username">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password (min 6 characters)" minlength="6" required>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" minlength="6" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="5" cols="30" placeholder="Enter your address" required></textarea>

            <div class="buttons">
                <input type="submit" value="Register" class="btn">
                <input type="button" value="Reset" class="btn" onclick="resetForm()">
            </div>
        </form>
    </main>

    <footer class="site-footer">

</body>
</html>
