<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        .box {
            background-color: white;
            border: 1px solid black;
            padding: 15px;
            margin: 15px;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 8px 15px;
        }
            
    </style>
</head>

<body>

    <h2>Student Hub Dashboard</h2>

    <div class="box">
        <h3>Profile</h3>
        <p>Name: Daksh</p>
        <button>View</button>
    </div>

    <div class="box">
        <h3>Assignments</h3>
        <p>3 Pending</p>
        <button>Open</button>
    </div>

    <div class="box">
        <h3>Events</h3>
        <p>2 Upcoming</p>
        <button>View</button>
    </div>

    <div class="box">
        <h3>Notices</h3>
        <p>5 New Notices</p>
        <button>Read</button>
    </div>

</body>
</html>
