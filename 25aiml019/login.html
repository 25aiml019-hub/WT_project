<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 220px;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 245px;
            padding: 10px;
            cursor: pointer;
        }

        #btn {
            background-color: #2644da;
            color: white;
            border: none;
        }
    </style>
    <script>

        function validateform() {
  
                var password = document.getElementById("password").value;

                let passwordpattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{6,}$/;
                if (!passwordpattern.test(password)) {
                    alert("Please enter a valid password (password must have 6 characters with uppercase, lowercase, and number).");
                    return false;
                }

            }
    </script>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>


    <form action="dashboard.html" method="get" name="myform" onsubmit="return validateform()" >
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br>
        <input type="submit" id="btn" value="Login">
    </form>
    <p style="margin-top: 15px; font-size: 14px;">Don't have an account? <a href="register.html">Register here</a></p>

</div>

</body>
</html>
