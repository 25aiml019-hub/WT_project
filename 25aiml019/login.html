<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 220px;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 245px;
            padding: 10px;
            cursor: pointer;
        }

        #btn {
            background-color: #2644da;
            color: white;
            border: none;
        }
    </style>
    <script>
        function f() {
            var a = document.forms["myform"];
            var u= a.email.value;
            var p= a.password.value;
            if (u == "admin@example.com" && p == "admin123") {
                alert("Login successful!");
            } else {
                alert("Invalid email or password.");
            }
        }
    </script>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>


    <form action="register.html" method="get" name="myform">

        <input type="email" name="email" placeholder="Enter your email" required><br>
        <input type="password" name="password"   placeholder="Enter your password" required><br>
        <input type="submit" id="btn" onclick="f()" value="Login">


    </form>

</div>

</body>
</html>
