<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            width: 350px;
            background-color: white;
            padding: 30px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ddd;
            object-fit: cover;
        }

        .profile-card h1 {
            margin: 15px 0 5px;
            font-size: 28px;
        }

        .title {
            margin: 0;
            color: #555;
            font-size: 18px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin: 20px 0;
        }

        .button-container {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="profile-card">


        <h1>daksh</h1>

        <p class="title">Web Developer</p>

        <p class="description">
            I love building simple and clean web pages using HTML and CSS.
        </p>

        <div class="button-container">
            <button class="btn">Contact Me</button>
        </div>

    </div>

</body>
</html>
