<!DOCTYPE html>
<html>
<head>
    <title>Admin Page</title>

    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        .admin {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border: 1px solid gray;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        .option {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    
    </style>
</head>

<body>

    <div class="admin">
        <h2>Admin Dashboard</h2>

        <div class="option">
            <h3>Manage Students</h3>
            <button>Open</button>
        </div>

        <div class="option">
            <h3>Manage Events</h3>
            <button>Open</button>
        </div>

        <div class="option">
            <h3>View Feedback</h3>
            <button>Open</button>
        </div>

        <div class="option">
            <h3>Logout</h3>
            <button>Logout</button>
        </div>

    </div>

</body>
</html>
