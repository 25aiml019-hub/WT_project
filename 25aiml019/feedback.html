<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        .feedback {
            width: 300px;
            margin: auto;
            background: white;
            padding: 20px;
            border: 1px solid gray;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

    <div class="feedback">
        <h2>Feedback</h2>

        <form>
            <input type="text" placeholder="Enter Your Name" required>

            <textarea rows="5" placeholder="Write Your Feedback" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
