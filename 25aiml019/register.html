<!DOCTYPE html>
<html>
<head>

    <title>Student Registration Form</title>
    <link rel="stylesheet" href="register.css">

    <script>

        function validateform() {

            var name = document.getElementById("fullname").value.trim();
            var email = document.getElementById("email").value.trim();
            var enrolment = document.getElementById("enrolment").value.trim();
            var password = document.getElementById("password").value;
            var confirm_password = document.getElementById("confirm_password").value;
            var department = document.getElementById("department").value;
            var address = document.getElementById("address").value.trim();

            var gender = document.querySelector(
                'input[name="gender"]:checked'
            );

          
            if (name === "") {
                alert("Please enter your name.");
                return false;
            }

            if (email === "") {
                alert("Please enter your email.");
                return false;
            }

            if (!gender) {
                alert("Please select a gender.");
                return false;
            }

            if (department === "") {
                alert("Please select a department.");
                return false;
            }

            
            if (address === "") {
                alert("Please enter an address.");
                return false;
            }

            
            var enrolmentpattern = /^[0-9]{2}aiml[0-9]{3}$/;

            if (!enrolmentpattern.test(enrolment)) {
                alert("Invalid enrollment number. Use format: 22aiml001");
                return false;
            }

            
            var passwordpattern =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{6,}$/;

            if (!passwordpattern.test(password)) {
                alert("Invalid password. Password must contain at least 6 characters, one uppercase letter, one lowercase letter, and one number.");
                return false;
            }

            if (confirm_password === "") {
                alert("Please confirm your password.");
                return false;
            }

            if (password !== confirm_password) {
                alert("Password and Confirm Password do not match.");
                return false;
            }

            alert("Form submitted successfully!");
            return true;
        }

    </script>

</head>

<body>

    <form action="" onsubmit="return validateform()">

        <label>Full Name</label>
        <input type="text"
               id="fullname"
               placeholder="Enter your name"
               required>
        <br><br>

        <label>Email</label>
        <input type="email"
               id="email"
               placeholder="Enter your email"
               required>
        <br><br>

        <label>Enrollment Number</label>
        <input type="text"
               id="enrolment"
               placeholder="Example: 22aiml001"
               required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               placeholder="Enter your password"
               required>
        <br><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password"
               id="confirm_password"
               placeholder="Confirm your password"
               required>
        <br><br>

        <label>Gender:</label>
        <br>

        <input type="radio"
               name="gender"
               id="male"
               value="Male"
               required>

        <label for="male">Male</label>

        <input type="radio"
               name="gender"
               id="female"
               value="Female">

        <label for="female">Female</label>

        <br><br>

        <label>Department:</label>
        <br>

        <select required id="department">

            <option value="">-- Select Department --</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="CIVIL">CIVIL</option>
            <option value="MECH">MECH</option>

        </select>

        <br><br>

        <label>Hobbies</label>
        <br>

        <input type="checkbox" id="reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music">
        <label for="music">Music</label>

        <br><br>

        <label>Address</label>
        <br>

        <textarea id="address"
                  rows="4"
                  cols="50"
                  placeholder="Enter your address"></textarea>

        <br><br>

        <input type="submit"
               name="submit"
               value="Register">

        <input type="reset"
               value="Reset">

    </form>

</body>
</html>
