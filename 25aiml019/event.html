<!DOCTYPE html>
<html>
<head>
    <title>Events</title>

    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        .event {
            background: white;
            border: 1px solid gray;
            padding: 15px;
            margin: 15px 0;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
            
    </style>
</head>

<body>

    <h2>Upcoming Events</h2>

    <div class="event">
        <h3>Tech Workshop</h3>
        <p><b>Date:</b> 10 August 2026</p>
        <p><b>Venue:</b> Seminar Hall</p>
        <button>Register</button>
    </div>

    <div class="event">
        <h3>Coding Competition</h3>
        <p><b>Date:</b> 15 August 2026</p>
        <p><b>Venue:</b> Computer Lab</p>
        <button>Register</button>
    </div>

    <div class="event">
        <h3>Sports Day</h3>
        <p><b>Date:</b> 22 August 2026</p>
        <p><b>Venue:</b> College Ground</p>
        <button>Register</button>
    </div>

</body>
</html>
